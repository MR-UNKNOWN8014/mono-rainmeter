[Rainmeter]
Update=25
Group=Mono
AccurateText=1
; the title text arrives after load; without this the window stays 50px tall and clips it
DynamicWindowSize=1
ContextTitle=Mono settings
ContextAction=[!ActivateConfig "Mono\Settings" "Settings.ini"]

[Metadata]
Name=Mono Music
Information=7-band audio visualizer; dots when silent. Optional track title (Music=2).

[Variables]
@Include=#@#Variables.inc
; bar box height; bars grow from the middle
H=40
CX=120
; drag-handle box: bars only, or bars + one title line
BoxW=(#Music#=2 ? 240 : 96)
BoxH=(#Music#=2 ? #H#+34 : #H#)

; ---------- Measures ----------

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=10
FFTDecay=150
Bands=7
FreqMin=40
FreqMax=12000
Sensitivity=35

[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0

[MeasureBand1]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=1

[MeasureBand2]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=2

[MeasureBand3]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=3

[MeasureBand4]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=4

[MeasureBand5]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=5

[MeasureBand6]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=6

; Title comes from Windows' own media session via smtc.ps1, so browsers (Brave, Edge...) work.
; Rainmeter's NowPlaying measure can't see browsers.
; RunCommand does nothing until told to "Run", so MeasureTick fires it every 120 updates (~3s).
; ponytail: spawns powershell every ~3s, only while Music=2. Slower poll = bigger % in MeasureTick.
[MeasureTick]
Measure=Calc
Formula=(Counter % 120)
IfEqualValue=1
IfEqualAction=[!CommandMeasure MeasureTitle "Run"]
Disabled=(#Music#<>2)

[MeasureTitle]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#smtc.ps1"
State=Hide
OutputType=UTF8
Timeout=8000
Substitute="#CRLF#":""

; ---------- Meters ----------
; each bar: 4px wide, height max(4, level*H), centered in H. Silence = 4x4 rounded = dot.

[StyleBar]
Y=0
X=8R
DynamicVariables=1

[MeterBar0]
Meter=Shape
MeterStyle=StyleBar
X=(#CX#-38)
Shape=Rectangle 0,((#H#-max(4,[MeasureBand0]*#H#))/2),4,(max(4,[MeasureBand0]*#H#)),2 | Fill Color #Fg# | StrokeWidth 0

[MeterBar1]
Meter=Shape
MeterStyle=StyleBar
Shape=Rectangle 0,((#H#-max(4,[MeasureBand1]*#H#))/2),4,(max(4,[MeasureBand1]*#H#)),2 | Fill Color #Fg# | StrokeWidth 0

[MeterBar2]
Meter=Shape
MeterStyle=StyleBar
Shape=Rectangle 0,((#H#-max(4,[MeasureBand2]*#H#))/2),4,(max(4,[MeasureBand2]*#H#)),2 | Fill Color #Fg# | StrokeWidth 0

[MeterBar3]
Meter=Shape
MeterStyle=StyleBar
Shape=Rectangle 0,((#H#-max(4,[MeasureBand3]*#H#))/2),4,(max(4,[MeasureBand3]*#H#)),2 | Fill Color #Fg# | StrokeWidth 0

[MeterBar4]
Meter=Shape
MeterStyle=StyleBar
Shape=Rectangle 0,((#H#-max(4,[MeasureBand4]*#H#))/2),4,(max(4,[MeasureBand4]*#H#)),2 | Fill Color #Fg# | StrokeWidth 0

[MeterBar5]
Meter=Shape
MeterStyle=StyleBar
Shape=Rectangle 0,((#H#-max(4,[MeasureBand5]*#H#))/2),4,(max(4,[MeasureBand5]*#H#)),2 | Fill Color #Fg# | StrokeWidth 0

[MeterBar6]
Meter=Shape
MeterStyle=StyleBar
Shape=Rectangle 0,((#H#-max(4,[MeasureBand6]*#H#))/2),4,(max(4,[MeasureBand6]*#H#)),2 | Fill Color #Fg# | StrokeWidth 0

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=#CX#
Y=(#H#+10)
W=230
ClipString=1
StringAlign=CenterTop
StringCase=Upper
FontFace=Quicksand
FontWeight=700
FontSize=9
FontColor=#Fg#
StringEffect=Shadow
FontEffectColor=#Paper#,110
AntiAlias=1
DynamicVariables=1
Hidden=(#Music#<>2)

; ---------- Drag handle: visible only while unlocked ----------
[MeterEdit]
Meter=Shape
Shape=Rectangle (#CX#-#BoxW#/2),0,#BoxW#,#BoxH#,10 | Fill Color #Fg#,18 | StrokeWidth 1 | Stroke Color #Fg#,110
DynamicVariables=1
Hidden=(#MusicLock#)
