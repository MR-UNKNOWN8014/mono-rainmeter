[Rainmeter]
Update=-1
Group=Mono
AccurateText=1
MouseLeaveAction=[!HideMeterGroup Drag][!Redraw]

[Metadata]
Name=Mono Settings
Information=Click an option or drag the size slider. Choices are written to @Resources\Variables.inc and survive restarts.

[Variables]
@Include=#@#Variables.inc
Save=!WriteKeyValue Variables
File="#@#Variables.inc"
LX=24
OX=124

[StyleLabel]
FontFace=Quicksand
FontWeight=700
FontSize=9
FontColor=#SInk#
StringCase=Upper
AntiAlias=1
X=#LX#

; option chip: active = filled with ink + text in plate color; inactive = faint tint + ink text
[StyleOpt]
FontFace=Quicksand
FontWeight=700
FontSize=9
StringCase=Upper
AntiAlias=1
Padding=11,5,11,5
X=6R
Y=0r

[MeasureScale]
Measure=Calc
Formula=#Scale#*100
DynamicVariables=1

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,380,346,14 | Fill Color #SCard# | StrokeWidth 1 | Stroke Color #SInk#,40

[MeterTitle]
Meter=String
Text=Mono
X=#LX#
Y=20
FontFace=Anurati
FontSize=13
FontColor=#SInk#
StringEffect=Border
FontEffectColor=#SInk#
AntiAlias=1

[MeterClose]
Meter=String
Text=Close
X=356
Y=24
StringAlign=Right
StringCase=Upper
FontFace=Quicksand
FontWeight=700
FontSize=8
FontColor=#SInk#,190
AntiAlias=1
LeftMouseUpAction=[!DeactivateConfig]

[MeterRule1]
Meter=Shape
Shape=Line #LX#,58,356,58 | StrokeWidth 1 | Stroke Color #SInk#,40

[MeterLinesLabel]
Meter=String
MeterStyle=StyleLabel
Text=Lines:
Y=78

[MeterLinesH]
Meter=String
MeterStyle=StyleOpt
Text=Horizontal
X=#OX#
Y=72
SolidColor=#SInk#,(#Lines#=0 ? 255 : 26)
FontColor=(#Lines#=0 ? #PR# : #IR#),(#Lines#=0 ? #PG# : #IG#),(#Lines#=0 ? #PB# : #IB#),255
LeftMouseUpAction=[#Save# Lines 0 #File#][!Refresh "Mono\Clock"][!Refresh]

[MeterLinesV]
Meter=String
MeterStyle=StyleOpt
Text=Vertical
SolidColor=#SInk#,(#Lines#=1 ? 255 : 26)
FontColor=(#Lines#=1 ? #PR# : #IR#),(#Lines#=1 ? #PG# : #IG#),(#Lines#=1 ? #PB# : #IB#),255
LeftMouseUpAction=[#Save# Lines 1 #File#][!Refresh "Mono\Clock"][!Refresh]

[MeterMusicLabel]
Meter=String
MeterStyle=StyleLabel
Text=Music:
Y=120

[MeterMusicOff]
Meter=String
MeterStyle=StyleOpt
Text=Off
X=#OX#
Y=114
SolidColor=#SInk#,(#Music#=0 ? 255 : 26)
FontColor=(#Music#=0 ? #PR# : #IR#),(#Music#=0 ? #PG# : #IG#),(#Music#=0 ? #PB# : #IB#),255
LeftMouseUpAction=[#Save# Music 0 #File#][!DeactivateConfig "Mono\Music"][!RefreshGroup Mono]

[MeterMusicBars]
Meter=String
MeterStyle=StyleOpt
Text=Bars
SolidColor=#SInk#,(#Music#=1 ? 255 : 26)
FontColor=(#Music#=1 ? #PR# : #IR#),(#Music#=1 ? #PG# : #IG#),(#Music#=1 ? #PB# : #IB#),255
LeftMouseUpAction=[#Save# Music 1 #File#][!ActivateConfig "Mono\Music" "Music.ini"][!RefreshGroup Mono]

[MeterMusicTitle]
Meter=String
MeterStyle=StyleOpt
Text=Bars + Title
SolidColor=#SInk#,(#Music#=2 ? 255 : 26)
FontColor=(#Music#=2 ? #PR# : #IR#),(#Music#=2 ? #PG# : #IG#),(#Music#=2 ? #PB# : #IB#),255
LeftMouseUpAction=[#Save# Music 2 #File#][!ActivateConfig "Mono\Music" "Music.ini"][!RefreshGroup Mono]

[MeterColorLabel]
Meter=String
MeterStyle=StyleLabel
Text=Color:
Y=162

[MeterColorBlack]
Meter=String
MeterStyle=StyleOpt
Text=Black
X=#OX#
Y=156
SolidColor=#SInk#,(#Shade#=0 ? 255 : 26)
FontColor=(#Shade#=0 ? #PR# : #IR#),(#Shade#=0 ? #PG# : #IG#),(#Shade#=0 ? #PB# : #IB#),255
LeftMouseUpAction=[#Save# Shade 0 #File#][!RefreshGroup Mono]

[MeterColorWhite]
