MeterStyle=StyleOpt
Text=White
SolidColor=#SInk#,(#Shade#=255 ? 255 : 26)
FontColor=(#Shade#=255 ? #PR# : #IR#),(#Shade#=255 ? #PG# : #IG#),(#Shade#=255 ? #PB# : #IB#),255
