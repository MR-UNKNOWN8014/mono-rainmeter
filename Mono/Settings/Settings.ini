[MeterSizeLabel]
Meter=String
MeterStyle=StyleLabel
Text=Size:
Y=204

; Size slider. Rainmeter has no drag event, so: press a notch -> value applies and a hidden layer (group Drag)
; of taller hover zones appears; moving over them with the button held applies their value; release hides it.
; Track: 16 notches, 10px each (50%..200% in 10% steps).
[MeterSize]
Meter=Shape
X=#OX#
Y=196
Shape=Rectangle 0,0,176,28 | Fill Color 0,0,0,0 | StrokeWidth 0
Shape2=Rectangle 8,12,160,4,2 | Fill Color #SInk#,70 | StrokeWidth 0
Shape3=Rectangle 8,12,(5+(#Scale#-0.5)*100),4,2 | Fill Color #SInk# | StrokeWidth 0
Shape4=Ellipse (13+(#Scale#-0.5)*100),14,8 | Fill Color #SInk# | StrokeWidth 0
DynamicVariables=1

[MeterNotch0]
Meter=Shape
X=(#OX#+8)
Y=196
Shape=Rectangle 0,0,10,28 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseDownAction=[!SetVariable Scale 0.5][#Save# Scale 0.5 #File#][!UpdateMeasure MeasureScale][!UpdateMeter MeterSize][!UpdateMeter MeterSizePct][!Redraw][!Refresh "Mono\Clock"][!ShowMeterGroup Drag][!Redraw]

