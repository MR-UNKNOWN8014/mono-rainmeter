[Rainmeter]
Update=1000
Group=Mono
AccurateText=1
ContextTitle=Mono settings
ContextAction=[!ActivateConfig "Mono\Settings" "Settings.ini"]

[Metadata]
Name=Mono Clock
Information=Greeting / day / date / time. Size and lock via Settings (right-click > Mono settings).

[Variables]
@Include=#@#Variables.inc
S=#Scale#
CX=(240*#S#)
Gap=(25*#S#)
Len=(90*#S#)
Stroke=(2*#S#)
; drag-handle box: fits the visible layout (vertical column or horizontal span)
BoxW=(#Lines#=1 ? 240*#S# : 2*(#Len#+#Gap#)+[MeterDay:W]+24*#S#)
BoxH=(#Lines#=1 ? [MeterLineBottom:Y]+[MeterLineBottom:H] : [MeterTime:Y]+[MeterTime:H]+6*#S#)

; ---------- Measures ----------

[MeasureGreeting]
Measure=Time
Format=%H
RegExpSubstitute=1
Substitute="^(0[5-9]|1[01])$":"GOOD#CRLF#MORNING","^(1[2-6])$":"GOOD#CRLF#AFTERNOON","^(1[7-9]|20)$":"GOOD#CRLF#EVENING","^(2[1-3]|0[0-4])$":"GOOD#CRLF#NIGHT"

[MeasureDay]
Measure=Time
Format=%a

[MeasureDate]
Measure=Time
Format=%#d  %B  %Y

[MeasureTime]
Measure=Time
Format=%I:%M %p

; ---------- Meters ----------
; Bold + larger text, and a 1px shadow in the opposite shade so it stays readable on any wallpaper.

[StyleText]
X=#CX#
StringAlign=CenterTop
StringCase=Upper
FontFace=Quicksand
FontWeight=700
FontSize=(12*#S#)
FontColor=#Fg#
StringEffect=Shadow
FontEffectColor=#Paper#,110
AntiAlias=1

[MeterLineTop]
Meter=Shape
Shape=Line #CX#,0,#CX#,(80*#S#) | StrokeWidth #Stroke# | Stroke Color #Fg#
Hidden=(1-#Lines#)

; vertical mode reserves 110*S above for the top line; horizontal mode starts at 0
[MeterGreeting]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureGreeting
Y=(#Lines#*110*#S#)

[MeterDay]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDay
FontFace=Anurati
FontWeight=400
FontSize=(40*#S#)
InlineSetting=CharacterSpacing | 10 | 10
Y=(8*#S#)R

[MeterDate]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDate
Y=(8*#S#)R

[MeterTime]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureTime
Y=(4*#S#)R

[MeterLineBottom]
Meter=Shape
Shape=Line #CX#,0,#CX#,(80*#S#) | StrokeWidth #Stroke# | Stroke Color #Fg#
Y=(30*#S#)R
Hidden=(1-#Lines#)

; horizontal lines hug the day text whatever its width
[MeterLinesSide]
Meter=Shape
Y=([MeterDay:Y]+[MeterDay:H]/2)
Shape=Line (#CX#-[MeterDay:W]/2-#Gap#),1,(#CX#-[MeterDay:W]/2-#Gap#-#Len#),1 | StrokeWidth #Stroke# | Stroke Color #Fg#
Shape2=Line (#CX#+[MeterDay:W]/2+#Gap#),1,(#CX#+[MeterDay:W]/2+#Gap#+#Len#),1 | StrokeWidth #Stroke# | Stroke Color #Fg#
DynamicVariables=1
Hidden=(#Lines#)

; ---------- Drag handle: visible only while unlocked ----------
[MeterEdit]
Meter=Shape
Shape=Rectangle (#CX#-#BoxW#/2),0,#BoxW#,#BoxH#,10 | Fill Color #Fg#,18 | StrokeWidth 1 | Stroke Color #Fg#,110
DynamicVariables=1
Hidden=(#ClockLock#)
